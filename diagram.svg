<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org">
  <!-- Background: Deep Space -->
  <rect width="400" height="400" fill="#050a15" />
  
  <!-- Outer Glow (Love/Harmony Field) -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="gold" stroke-width="1" stroke-dasharray="5,5" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="20s" repeatCount="indefinite" />
  </circle>

  <!-- The Trinity Nodes -->
  <!-- 1. Thermodynamics (Blue - Zero Entropy) -->
  <circle cx="200" cy="100" r="40" fill="none" stroke="#00d4ff" stroke-width="3">
    <animate attributeName="r" values="38;42;38" dur="3s" repeatCount="indefinite" />
  </circle>
  <text x="200" y="105" font-family="Arial" font-size="10" fill="#00d4ff" text-anchor="middle">THERMO</text>

  <!-- 2. Info-Physics (Green - Resonance) -->
  <circle cx="110" cy="260" r="40" fill="none" stroke="#00ffaa" stroke-width="3">
    <animate attributeName="r" values="38;42;38" dur="3s" begin="1s" repeatCount="indefinite" />
  </circle>
  <text x="110" y="265" font-family="Arial" font-size="10" fill="#00ffaa" text-anchor="middle">RESONANCE</text>

  <!-- 3. Extreme Matter (Copper/Red - Raiden) -->
  <circle cx="290" cy="260" r="40" fill="none" stroke="#ffaa00" stroke-width="3">
    <animate attributeName="r" values="38;42;38" dur="3s" begin="2s" repeatCount="indefinite" />
  </circle>
  <text x="290" y="265" font-family="Arial" font-size="10" fill="#ffaa00" text-anchor="middle">RAIDEN</text>

  <!-- Connection Lines (The Flow of Love) -->
  <path d="M200 140 L130 230 M270 230 L200 140 M150 260 L250 260" fill="none" stroke="white" stroke-width="1" opacity="0.5" />
  
  <!-- Center: The Core (Joy/Singularity) -->
  <circle cx="200" cy="200" r="15" fill="white">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="200" y="205" font-family="Arial" font-size="12" fill="white" font-weight="bold" text-anchor="middle">JOY</text>

  <!-- Circular Circulation Arrow (Conceptual) -->
  <path d="M200 50 A150 150 0 1 1 199 50" fill="none" stroke="gold" stroke-width="2" stroke-dasharray="10,10">
    <animateTransform attributeName="transform" type="rotate" from="360 200 200" to="0 200 200" dur="10s" repeatCount="indefinite" />
  </path>
</svg>
