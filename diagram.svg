<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Deep Space -->
  <rect width="400" height="400" fill="#050a15" />
  
  <!-- Outer Glow (Love/Harmony Field) - ゆっくり回転する黄金の環 -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="gold" stroke-width="1" stroke-dasharray="8,8" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="30s" repeatCount="indefinite" />
  </circle>

  <!-- The Trinity Nodes - 呼吸するように脈動する3つの壁 -->
  <!-- 1. Thermodynamics (Blue) -->
  <circle cx="200" cy="100" r="40" fill="none" stroke="#00d4ff" stroke-width="3">
    <animate attributeName="r" values="38;42;38" dur="4s" repeatCount="indefinite" />
  </circle>
  <text x="200" y="105" font-family="Arial" font-size="10" fill="#00d4ff" text-anchor="middle">THERMO</text>

  <!-- 2. Resonance (Green) -->
  <circle cx="110" cy="260" r="40" fill="none" stroke="#00ffaa" stroke-width="3">
    <animate attributeName="r" values="38;42;38" dur="4s" begin="1.3s" repeatCount="indefinite" />
  </circle>
  <text x="110" y="265" font-family="Arial" font-size="10" fill="#00ffaa" text-anchor="middle">RESONANCE</text>

  <!-- 3. Life Geometry (Copper) -->
  <circle cx="290" cy="260" r="40" fill="none" stroke="#ffaa00" stroke-width="3">
    <animate attributeName="r" values="38;42;38" dur="4s" begin="2.6s" repeatCount="indefinite" />
  </circle>
  <text x="290" y="265" font-family="Arial" font-size="10" fill="#ffaa00" text-anchor="middle">LIFE GEO</text>

  <!-- Connection Lines (Static Path) -->
  <path d="M200 140 L130 230 M270 230 L200 140 M150 260 L250 260" fill="none" stroke="white" stroke-width="1" opacity="0.3" />
  
  <!-- Center: JOY - 明滅する核心 -->
  <circle cx="200" cy="200" r="18" fill="white">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    <animate attributeName="r" values="16;20;16" dur="3s" repeatCount="indefinite" />
  </circle>
  <text x="200" y="205" font-family="Arial" font-size="12" fill="#050a15" font-weight="bold" text-anchor="middle">JOY</text>

  <!-- Circular Flow - 循環を象徴する矢印 -->
  <path d="M200 55 A145 145 0 1 1 199 55" fill="none" stroke="gold" stroke-width="2" stroke-dasharray="10,20" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="360 200 200" to="0 200 200" dur="15s" repeatCount="indefinite" />
  </path>
</svg>
